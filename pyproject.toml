[project]
name = "fbarchive-cli"
version = "0.1.0"
description = "Fast, local search and viewer for Facebook 'Download your information' exports."
readme = "README.md"
requires-python = ">=3.11"
# Exact pins, identical to bin/fbarchive: a compromised upstream release
# cannot arrive through a loose specifier.
dependencies = [
  "click==8.5.0",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "orjson==3.12.0",
  "pillow==12.3.0",
]

[project.scripts]
fbarchive = "fbarchive.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbarchive"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
